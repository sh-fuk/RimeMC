[package]
name = "rime-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
airworld = { version = "0.1.0", path = "../airworld" }
anyhow = "1.0.104"
base64 = "0.22"
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
cfb8 = "0.8"
clap = { version = "4.6.9", features = ["derive"] }
ctr = "0.9"
flate2 = "1.1.11"
hex = "0.4.3"
md-5 = "0.10"
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
parking_lot = "0.13.0"
pollster = { version = "1.0.3", optional = true }
rand = "0.8"
rayon = "1.12.0"
rime-fleet = { version = "0.1.0", path = "../rime-fleet" }
rsa = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3.5.2"
uuid = { version = "1.29.3", features = ["v3", "v4"] }
wgpu = { version = "30.0.2", optional = true }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
zip = { version = "9.8.0", default-features = false, features = ["deflate"] }


[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[[bin]]
name = "rime"
path = "src/main.rs"
